# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 2
    shadow {
        enabled = false
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = no
}

windowrule = opacity 0.90, class:cursor
windowrule = opacity 0.90, class:nvim